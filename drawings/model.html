<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body { margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
  header { padding: 24px 24px 8px; } h1 { margin: 0; } p { margin: 4px 0; color: var(--muted); } a { color: var(--link); }
  .cols { display: grid; grid-template-columns: repeat(6, 1fr); align-items: center; gap: 8px 24px; }
  @media (max-width: 599px) { .cols { grid-template-columns: 1fr; } }
  button { font: inherit; margin-right: 6px; padding: 2px 10px; }
  canvas { display: block; width: 100%; }
</style>
<header>
  <div class="cols">
    <h1>3D Model</h1>
    <div><b>Revision A</b> · 2026-11-13</div>
    <div><button data-view="end">End</button><button data-view="island">Island</button><button data-view="wall">Wall</button><button data-view="top">Top</button></div>
    <div><label>slab <select id="slab"><option value="">plain</option></select></label></div>
    <div><label>cabinets <select id="paint-haze"></select></label> <label>uppers <select id="paint-alabaster"></select></label></div>
    <div><label><input type="checkbox" id="small"> toaster, air fryer, coffee</label></div>
    <div><button id="toggle-theme">Toggle theme</button></div>
  </div>
</header>
<script src="../kitchen.js"></script>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const { island, wall } = RUNS; // the runs, from ../kitchen.js

const { toe: TOE, box: BOX, top: TOP, ceiling: CEILING, outlet: OUTLET, depth: DEPTH, front: FRONT, counter: COUNTER, aisle: AISLE, cooktopV: CV } = DIMS; // from ../kitchen.js
const UPPER = 12, APPLIANCE = 14, HOOD = 23.625; // wall cabinet depth; appliance depth assumed; hood depth per the Proline sheet
const len = run => run.reduce((s, c) => s + c.w, 0);
const total = Math.max(len(island), len(wall));
const ZWALL = 2 * COUNTER + AISLE; // the island's back is at z = 0, the room wall at ZWALL

const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--paper').trim());
const theme = document.getElementById('theme'), paper = () => scene.background.set(getComputedStyle(document.documentElement).getPropertyValue('--paper').trim());
const setTheme = light => { // dark by default; light swaps in the light stylesheet, remembered per browser
  theme.onload = paper;
  theme.href = light ? '../theme-light.css' : '../theme.css';
  try { localStorage.setItem('model-theme', light ? 'light' : 'dark'); } catch {}
};
try { if (localStorage.getItem('model-theme') === 'light') setTheme(true); } catch {}
document.getElementById('toggle-theme').onclick = () => setTheme(!theme.href.endsWith('light.css'));
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
const M = {
  box: mat('#bec6bd'), front: mat('#bec6bd'), base: mat('#bec6bd'), alabaster: mat('#ebeae6'), fixture: mat('#ebeae6'), // Colonial Maple Haze; Alabaster on the tall items and upper cabinets
  toe: mat('#556'), counter: mat('#ecebe6', { roughness: 0.3 }),
  steel: mat('#c9ccd2', { metalness: 0.5, roughness: 0.4 }), black: mat('#1b1b1b', { roughness: 0.3 }), brass: mat('#b08d57', { metalness: 0.6, roughness: 0.35 }),
  glass: mat('#bcd7e8', { transparent: true, opacity: 0.5 }), ring: mat('#8a8f99', { roughness: 0.4 }), drain: mat('#4a4d52', { metalness: 0.5, roughness: 0.4 }), pull: mat('#2b2b2b'), plate: mat('#ffffff'),
  hoodGlass: mat('#bcd7e8', { transparent: true, opacity: 0.4, side: THREE.DoubleSide, roughness: 0.1 }), light: mat('#fff6d8', { emissive: '#fff1c0' }), wall: mat('#e9e4d8'), floor: mat('#c8b48f'),
};
const edges = new THREE.LineBasicMaterial({ color: '#223', transparent: true, opacity: 0.35 });
const geo = new THREE.BoxGeometry(1, 1, 1), edgeGeo = new THREE.EdgesGeometry(geo);
let group = scene; // where cube() and rod() put things
const stone = []; // the counter and backsplash boxes, for the slab photos
const onSplash = []; // [plate on the wall, plate on the backsplash's face] over the counter
const cube = (x, y, z, w, h, d, m) => { // min corner, size
  const mesh = new THREE.Mesh(geo, m);
  mesh.scale.set(w, h, d);
  mesh.position.set(x + w / 2, y + h / 2, z + d / 2);
  mesh.add(new THREE.LineSegments(edgeGeo, edges));
  group.add(mesh);
  if (m === M.counter) stone.push(mesh);
  return mesh;
};
const rod = (a, b, r, m) => { // cylinder from point a to point b
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 16), m);
  mesh.position.copy(A).add(B).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  group.add(mesh);
};
const ring = (p, r, m) => { // flat ring centered at p
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(r, 0.08, 6, 48), m);
  mesh.position.set(...p);
  mesh.rotation.x = Math.PI / 2;
  group.add(mesh);
};

// One run in its own coordinates: u along the run from its left end, v from the cabinet backs toward the aisle, y up from the floor.
// The island faces +z from its back at zBack; the wall run faces -z from the wall and reads right to left.
function side(run, flip, zBack, back = 0, walls = false) { // back: counter past the cabinet backs (an item's own `back` wins); walls: side walls at the ends, so no overhang
  const n = len(run); // the wall run is flipped about its own length, so its right end meets the island's left end
  const B = (u, v, y, w, d, h, m) => cube(flip ? n - u - w : u, y, flip ? zBack - v - d : zBack + v, w, h, d, m);
  const P = (u, v, y) => [flip ? n - u : u, y, flip ? zBack - v : zBack + v];

  // Stack of fronts from `top` down, on the face at v; each row is { h, pair, pull: 'mid' | 'top' | 'bottom', glass }.
  const fronts = (u, w, top, rows, v = DEPTH) => {
    let y = top;
    for (const r of rows) {
      const m = alabaster ? M.alabaster : base ? M.base : M.front, y0 = y - r.h + 0.125, h = r.h - 0.25;
      const door = (du, dw) => {
        if (!r.glass) return B(du, v, y0, dw, 0.75, h, m);
        const f = 2.25; // glass door: a frame 2 1/4" wide (assumed) around a pane set back in it
        for (const fx of [du, du + dw - f]) B(fx, v, y0, f, 0.75, h, m);
        for (const fy of [y0, y0 + h - f]) B(du + f, v, fy, dw - 2 * f, 0.75, f, m);
        B(du + f, v + 0.25, y0 + f, dw - 2 * f, 0.125, h - 2 * f, M.glass);
      };
      if (r.pair) {
        door(u + 0.125, w / 2 - 0.1875);
        door(u + w / 2 + 0.0625, w / 2 - 0.1875);
        const py = r.pull === 'bottom' ? y - r.h + 2 : y - 10;
        for (const px of [u + w / 2 - 1.75, u + w / 2 + 1.25]) B(px, v + 0.75, py, 0.5, 0.75, 8, M.pull); // Berenson 9020-4055-P, 8" long
      } else {
        door(u + 0.125, w - 0.25);
        if (r.one) B(r.left ? u + 1.5 : u + w - 2, v + 0.75, r.pull === 'top' ? y - 10 : y - r.h + 2, 0.5, 0.75, 8, M.pull); // one hinged door: pull on its right, or its left with `left` (wall cabinets' hinge side assumed)
        else B(u + w / 2 - 4, v + 0.75, r.pull === 'top' ? y - 3 : y - r.h / 2, 8, 0.75, 0.5, M.pull);
      }
      y -= r.h;
    }
  };
  let base = false; // drawing a base-height item
  let alabaster = false; // drawing the pantry or an upper cabinet
  const cabinet = (u, w, h) => { B(u, 0, TOE, w, DEPTH, h - TOE, alabaster ? M.alabaster : base ? M.base : M.box); B(u, 0, 0, w, DEPTH - 3, TOE, M.toe); };

  let u = 0;
  for (const c of run) { c.u = u; u += c.w; }
  const face = BOX - TOE;
  for (const c of run) {
    if (c.kind === 'space') {
      continue;
    }
    const { u, w } = c;
    base = !c.h;
    alabaster = c.kind === 'pantry' || c.kind === 'oven';
    if (c.kind === 'gap' && c.h) { // fridge: stainless box c.d deep, French doors over a freezer drawer
      const d = c.d || DEPTH;
      B(u + 0.25, 0, 0, w - 0.5, d, c.h, M.steel);
      B(u + w / 2 - 0.1, d, 30, 0.2, 0.1, c.h - 30, M.black);
      B(u + 0.25, d, 30, w - 0.5, 0.1, 0.2, M.black);
      for (const px of [u + w / 2 - 2.5, u + w / 2 + 2]) B(px, d + 0.5, 40, 0.5, 1, 24, M.steel);
      B(u + 4, d + 0.5, 25, w - 8, 1, 0.5, M.steel);
    } else if (c.kind === 'gap') { // dishwasher: panel-ready front over a toe kick
      B(u, 0, 0, w, DEPTH - 3, TOE, M.toe);
      fronts(u, w, BOX, [{ h: face, pull: 'top' }]);
    } else if (c.kind === 'panel') {
      B(u, 0, 0, w, DEPTH + 0.75, c.h, M.alabaster);
    } else if (c.kind === 'pantry') {
      cabinet(u, w, c.h);
      fronts(u, w, c.h, [{ h: 39, pair: true, pull: 'bottom' }, { h: c.h - TOE - 39, pair: true, pull: 'top' }]); // top doors match a 39" wall cabinet
    } else if (c.kind === 'oven') { // OVD3393 (cabinets.com cut-out sheet): 22 3/8" door pair at the top, 7 1/16" drawer over the toe kick
      cabinet(u, w, c.h);
      fronts(u, w, c.h, [{ h: 22.375, pair: true, pull: 'bottom' }]);
      fronts(u, w, 11.5625, [{ h: 7.0625 }]);
      const ow = 29.75, ou = u + (w - ow) / 2;
      B(ou, DEPTH, 12, ow, 0.75, 26.5, M.steel); // Bosch HBL87M53UC: 29 3/4" x 49" face from 12" to 61" off the floor (position assumed), 26 5/8" oven under the microwave
      B(ou + 3, DEPTH + 0.75, 15.125, ow - 6, 0.1, 17.5, M.black); // drop-down doors, window sizes assumed
      B(ou + 3, DEPTH + 1, 34.75, ow - 6, 1, 0.75, M.steel);
      B(ou, DEPTH, 38.625, ow, 0.75, 22.375, M.steel);
      B(ou + 8, DEPTH + 0.75, 58.25, ow - 16, 0.1, 2, M.black); // control panel, size assumed
      B(ou + 3, DEPTH + 0.75, 43, ow - 6, 0.1, 12, M.black);
      B(ou + 3, DEPTH + 1, 56, ow - 6, 1, 0.75, M.steel);
    } else if (c.bowl) { // open above the bowl's bottom: sides and back only, so the bowl shows
      const y = BOX - c.bowl.left - 0.5;
      cabinet(u, w, y);
      for (const x of [u, u + w - 0.75]) B(x, 0, y, 0.75, DEPTH, BOX - y, M.base);
      B(u, 0, y, w, 0.75, BOX - y, M.base);
      fronts(u, w, BOX, [{ h: 6 }, { h: face - 6, pair: true }]);
    } else {
      cabinet(u, w, BOX);
      if (c.kind === 'drawers') {
        const rest = (face - 6) / (c.n - 1);
        fronts(u, w, BOX, [{ h: 6 }, ...Array(c.n - 2).fill({ h: rest }), { h: rest, pull: 'top' }]);
      } else if (c.kind === 'door') fronts(u, w, BOX, [{ h: face, pull: 'top', one: c.one }]);
      else if (c.kind === 'base') fronts(u, w, BOX, [{ h: 6 }, { h: face - 6, pull: 'top' }]);
    }
    if (c.receptacle) { // vertical duplex plate (assumed) at OUTLET, or `receptacleAt`, on the wall; over the counter a second one on the backsplash's face, shown when a slab shows the backsplash
      const r = v => B(u + (w - 2.75) / 2, v, (c.receptacleAt || OUTLET) - 2.25, 2.75, 0.25, 4.5, M.plate);
      const plate = r(0);
      if (!c.h) { const face = r(TOP); face.visible = false; onSplash.push([plate, face]); }
    }
    const wb = (c.inside || []).find(b => b.label === 'ice maker');
    if (wb) B(u + wb.dx - wb.w / 2, 0, wb.at - wb.h / 2, wb.w, 0.25, wb.h, M.plate); // recessed ice maker outlet box on the wall (size and spot assumed)
    if (c.backReceptacle) { // vertical duplex plate on the island's back wall, centered at 29" (height assumed)
      B(u + (w - 2.75) / 2, -4.75, 29 - 2.25, 2.75, 0.25, 4.5, M.plate);
    }
    if (c.airSwitch) { // InSinkErator STS-OO disposal air button: chrome collar and white button (size assumed)
      const p = (y) => P(u + c.airSwitch.dx, c.airSwitch.back, y);
      rod(p(BOX + TOP), p(BOX + TOP + 0.25), 0.875, M.steel);
      rod(p(BOX + TOP + 0.25), p(BOX + TOP + 0.75), 0.6, M.plate);
    }
    if (c.cooktop) { // Bosch NIT8061UC: black glass, four zones, touch-control strip at the front (layout as in the top view)
      const cu = u + (w - 31) / 2, cv = CV - 21.25 / 2, // centered 10 1/2" from the cabinet backs: 2" back from centered on the 25" counter (2026-10-27), kept at 25 3/4" (2026-11-05)
        y = BOX + TOP + 0.25;
      B(cu, cv, BOX + TOP, 31, 21.25, 0.25, M.black);
      for (const [du, dv] of [[8, 6], [23, 6], [8, 15.25], [23, 15.25]]) ring(P(cu + du, cv + dv, y + 0.02), 4, M.ring);
      B(cu + 8, cv + 19.25, y, 15, 1, 0.02, M.ring);
    }
    if (c.bowl) { // Ruvati RVH6222ST undermount, under a cutout in the counter (see below): open steel bowl, workstation ledges front and back, drain on the left
      const s = c.bowl, su = u + (w - s.w) / 2, sv = s.v, y = BOX;
      B(su, sv, y - s.left, s.w, s.d, 0.1, M.steel); // bottom (flat; really slopes 9 7/8" to 9 1/4")
      B(su, sv, y - s.left, 0.1, s.d, s.left, M.steel);
      B(su + s.w - 0.1, sv, y - s.left, 0.1, s.d, s.left, M.steel);
      B(su, sv, y - s.left, s.w, 0.1, s.left, M.steel);
      B(su, sv + s.d - 0.1, y - s.left, s.w, 0.1, s.left, M.steel);
      for (const lv of [sv, sv + s.d - s.ledge]) B(su, lv, y - 1, s.w, s.ledge, 0.1, M.steel); // ledges the accessories ride on
      rod(P(u + s.drain, sv + s.d / 2, y - s.left + 0.1), P(u + s.drain, sv + s.d / 2, y - s.left + 0.2), 1.75, M.drain);
    }
    if (c.faucet) { // Kohler spec sheet: a 13" column (from the drawing), the exposed spring arching up to h and over to the sprayhead
      // (9 1/2" clear under it) on a brass dock arm; side lever on a hub off the right side. Brass trim per the product photo
      const f = c.faucet, y0 = BOX + TOP, cu = u + w / 2, fv = f.back + f.reach, R = f.reach / 2, cy = y0 + f.h - 0.6 - R;
      rod(P(cu, f.back, y0), P(cu, f.back, y0 + 0.5), 1.25, M.black); // base
      rod(P(cu, f.back, y0), P(cu, f.back, y0 + 13), 0.65, M.black);
      const path = new THREE.CurvePath(); // spring centerline: up from the column, a half circle over, down to the sprayhead
      path.add(new THREE.LineCurve3(new THREE.Vector3(...P(cu, f.back, y0 + 13)), new THREE.Vector3(...P(cu, f.back, cy))));
      path.add(new THREE.CatmullRomCurve3(Array.from({ length: 17 }, (_, i) => { const t = Math.PI * (1 - i / 16);
        return new THREE.Vector3(...P(cu, f.back + R * (1 + Math.cos(t)), cy + R * Math.sin(t))); })));
      path.add(new THREE.LineCurve3(new THREE.Vector3(...P(cu, fv, cy)), new THREE.Vector3(...P(cu, fv, y0 + 14))));
      group.add(new THREE.Mesh(new THREE.TubeGeometry(path, 200, 0.3, 8), M.black)); // hose
      const len = path.getLength(), turns = Math.round(len / 0.5), side = new THREE.Vector3(1, 0, 0), coil = [];
      for (let i = 0; i <= turns * 16; i++) { // helix around the centerline (the run is along x, so x is always square to the arch)
        const s = i / (turns * 16), p = path.getPointAt(s), n = path.getTangentAt(s).cross(side), a = i / 16 * 2 * Math.PI;
        coil.push(p.clone().addScaledVector(n, 0.55 * Math.cos(a)).addScaledVector(side, 0.55 * Math.sin(a)));
      }
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(coil), coil.length, 0.09, 5), M.black));
      rod(P(cu, f.back, y0 + 11.75), P(cu, f.back, y0 + 13), 0.72, M.brass); // collar
      rod(P(cu, f.back, y0 + 12.25), P(cu, fv, y0 + 12.25), 0.3, M.brass); // dock arm
      rod(P(cu, fv, y0 + 14), P(cu, fv, y0 + 9.5), 0.65, M.black); // sprayhead
      rod(P(cu, fv, y0 + 14), P(cu, fv, y0 + 13.4), 0.7, M.brass);
      B(cu - 0.2, fv + 0.6, y0 + 11, 0.4, 0.15, 2, M.brass); // buttons, facing the aisle
      rod(P(cu + 0.6, f.back, y0 + 5), P(cu + 2.9, f.back, y0 + 5), 0.6, M.black); // lever hub
      rod(P(cu + 2.6, f.back, y0 + 5), P(cu + 2.6, f.back, y0 + 5 + 3.3125), 0.2, M.brass); // lever, at rest
    }
    base = false;
    for (const x of c.upper || []) {
      if (x.spot) continue; // drawn with the island, below
      if (x.hood) { // curved glass canopy over a steel body (filter, 4 lights, touch panel in front), chimney to the ceiling
        const top = x.at + x.h, bw = 21, bd = 17, bu = u + (w - bw) / 2, bv = CV - bd / 2; // body size assumed; centered over the cooktop, 10 1/2" from the cabinet backs (2026-11-05)
        B(bu, bv, x.at, bw, bd, x.h, M.steel);
        B(bu + 3, bv + 3, x.at - 0.05, bw - 6, bd - 6, 0.05, M.drain); // mesh filter
        for (const [lu, lv] of [[1.5, 1.5], [bw - 1.5, 1.5], [1.5, bd - 1.5], [bw - 1.5, bd - 1.5]]) rod(P(bu + lu, bv + lv, x.at - 0.1), P(bu + lu, bv + lv, x.at), 0.75, M.light);
        B(bu + bw / 2 - 3, bv + bd, x.at + 0.5, 6, 0.05, 1, M.black); // touch panel
        const glass = new THREE.PlaneGeometry(x.w, HOOD, 32, 1), pos = glass.attributes.position;
        for (let i = 0; i < pos.count; i++) pos.setZ(i, -x.h * (2 * pos.getX(i) / x.w) ** 2); // ends droop to the canopy bottom
        const pane = new THREE.Mesh(glass, M.hoodGlass);
        pane.add(new THREE.LineSegments(new THREE.EdgesGeometry(glass), edges));
        pane.rotation.x = -Math.PI / 2;
        pane.position.set(...P(u + w / 2, CV, top));
        group.add(pane);
        B(u + (w - x.chimney) / 2, CV - x.chimneyD / 2, top, x.chimney, x.chimneyD, CEILING - top, M.steel);
      } else if (x.coffee || x.appliance) { // into `small`, shown by its checkbox
        const g = group; group = small;
        B(u + (w - x.w) / 2, 2, x.at, x.w, APPLIANCE, x.h, M.black);
        group = g;
      }
      else if (x.riser) { // riser molding to the ceiling, 3/4" thick, on the front of a cabinet x.d deep; side: a return past the 12" uppers on the right
        const d = x.d || UPPER;
        B(u + (x.dx || 0), d, x.at, x.w || w, 0.75, x.h, M.alabaster);
        if (x.side) B(u + w, UPPER + 0.75, x.at, 0.75, d - UPPER, x.h, M.alabaster);
      } else if (x.light) B(u + (w - x.w) / 2, (x.d || UPPER) - 4, x.at, x.w, 3.5, x.h, M.light); // light bar near the front edge of a cabinet x.d deep (3 1/2" wide, Nicor UCB sheet); under a cabinet, or inside a glass one under its top
      else { // wall cabinet: x.d deep, else 12"; x.w wide from x.dx, else the item's width
        const d = x.d || UPPER, cu = u + (x.dx || 0), cw = x.w || w;
        alabaster = true;
        B(cu, 0, x.at, cw, d, x.h, M.alabaster);
        fronts(cu, cw, x.at + x.h, [{ h: x.h, pair: !x.one, one: x.one, left: x.left, pull: 'bottom', glass: x.glass }], d);
      }
    }
  }
  // Countertop over each stretch of base-height items; 1" overhang only at the ends of the run.
  run.forEach((c, i) => {
    if (c.h || (i > 0 && !run[i - 1].h)) return;
    let j = i;
    while (j + 1 < run.length && !run[j + 1].h) j++;
    const o = walls ? 0 : 1;
    const l = c.u - (i === 0 ? o : 0), r = run[j].u + run[j].w + (j === run.length - 1 ? o : 0);
    for (let k = i; k <= j; k++) { // counter behind the cabinet backs: c.back, else the run's back; neighbors with the same depth share a piece
      const d = run[k].back ?? back;
      if (!d || (k > i && (run[k - 1].back ?? back) === d)) continue;
      let m = k;
      while (m < j && (run[m + 1].back ?? back) === d) m++;
      const bl = k === i ? l : run[k].u, br = m === j ? r : run[m].u + run[m].w;
      B(bl, -d, BOX, br - bl, d, TOP, M.counter);
    }
    const cuts = []; // stone seams: where the depth behind the backs changes (the island's, between plates and trash)
    for (let k = i + 1; k <= j; k++) if ((run[k].back ?? back) !== (run[k - 1].back ?? back)) cuts.push(run[k].u);
    const C = (a, b, v, d) => { for (const s of [...cuts.filter(s => s > a && s < b), b]) { B(a, v, BOX, s - a, d, TOP, M.counter); a = s; } };
    const h = run.slice(i, j + 1).find(c => c.bowl); // counter in four pieces around the sink cutout

    C(l, a, 0, COUNTER);
    C(b, r, 0, COUNTER);
    C(a, b, 0, s.v);
    C(a, b, s.v + s.d, COUNTER - s.v - s.d);
  });

}

const runs = { island: new THREE.Group(), wall: new THREE.Group() };

runs.wall.add(small);

cube(0, 0, -4.5, island.reduce((s, c) => s + c.w, 0), BOX, 4.5, M.base); // the island's back wall (2x4 studs, 1/2" drywall each side), floor to the counter's underside, painted Haze

  const z = -16;
  rod([x, 24, z], [x, 25.5, z], 8, M.black);
  for (const [dx, dz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) rod([x + 6 * dx, 0, z + 6 * dz], [x + 4 * dx, 24, z + 4 * dz], 0.5, M.pull);
}
for (const [x, s] of island.flatMap(c => (c.upper || []).filter(p => p.spot).map(p => [c.u + p.dx, p]))) { // VANoopee ceiling spotlights at the task light marks on the top view, 18" from the cabinet backs, aimed straight down; canopy and stem sizes assumed
  const z = 18;
  rod([x, 95, z], [x, CEILING, z], 2.5, M.fixture); // canopy
  rod([x, s.at + s.h, z], [x, 95, z], 0.5, M.fixture); // stem
  rod([x, s.at, z], [x, s.at + s.h, z], s.w / 2, M.fixture); // head
  rod([x, s.at - 0.05, z], [x, s.at, z], s.w / 2 - 0.4, M.light); // lens
}
group = runs.wall;
const g = wall.find(c => !c.h), splash = side(wall, true, ZWALL, 0, true)(g.u, 0, DIMS.counterH, len(wall.filter(c => !c.h)), TOP, 54 - DIMS.counterH, M.counter); // one-piece stone backsplash, Garage to Coffee, counter to the W2127s at 54"; shown with a slab, receptacle cutouts not drawn

group = scene;
for (const k of [1, 3, 5, 7]) { // four Halo HLBC6 ambient downlights down the middle of the aisle, evenly spaced along the island (as in sketches.html); trim 7 1/2" across (assumed)
  const x = DIMS.islandLen * k / 8, z = ZWALL / 2;
  rod([x, CEILING - 0.25, z], [x, CEILING, z], 3.75, M.plate); // trim
  rod([x, CEILING - 0.3, z], [x, CEILING - 0.25, z], 3, M.light); // lens
}

// Room: floor, and the wall behind the wall run, only as wide as the run (one-sided, so it hides itself when viewed from behind).
const floor = new THREE.Mesh(new THREE.PlaneGeometry(total + 96, ZWALL + 48), M.floor);
floor.rotation.x = -Math.PI / 2;
floor.position.set(total / 2, 0, ZWALL / 2 - 24);
scene.add(floor);
const back = new THREE.Mesh(new THREE.PlaneGeometry(len(wall), CEILING), M.wall);
back.rotation.y = Math.PI;
back.position.set(len(wall) / 2, CEILING / 2, ZWALL);
scene.add(back);

scene.add(new THREE.HemisphereLight('#ffffff', '#b0a080', 2.2));
for (const [x, y, z] of [[-100, 300, 200], [300, 250, -100]]) { // one light toward each run's fronts
  const sun = new THREE.DirectionalLight('#ffffff', 1);
  sun.position.set(x, y, z);
  scene.add(sun);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
const mid = ZWALL / 2;
const views = { // camera position, target, run to hide (it would block the view)
  end: [[total + 150, 160, mid], [total / 2, 36, mid]],
  island: [[total / 2, 80, ZWALL + 150], [total / 2, 40, 20], 'wall'],
  wall: [[total / 2, 60, -150], [total / 2, 48, ZWALL - 12], 'island'],
  top: [[total / 2, 420, mid + 0.01], [total / 2, 0, mid]],
};
const show = (name) => {
  const [pos, target, hide] = views[name];
  camera.position.set(...pos);
  controls.target.set(...target);
  controls.update();

  back.visible = hide !== 'wall';
};
// Colonial Maple colors, from the swatches on cabinets.com/kitchen-cabinets (2026-11-11); Fog, Sand and Latte are photo swatches, averaged; Unfinished is a guess at raw maple (its swatch is blank); the glazes use their base color
const PAINTS = { 'Bright White': '#f1f1f1', Alabaster: '#e8e8e6', 'Antique White': '#ece6cf', 'Soft Beige': '#d1c7b8', Oyster: '#cdccca', 'Willow Gray': '#bbb7b0', Fog: '#909687', Moss: '#6c776f', Haze: '#c3cac2', 'Smoky Blue': '#708d9e', 'Creek Stone': '#7a7269', 'Thunder Gray': '#6d6c62', 'Billiard Green': '#4b5c52', Basil: '#465250', Naval: '#283846', Midnight: '#4e4b50', Raisin: '#50393c', Iron: '#362f27', Truffle: '#4d4840', Ebony: '#222124',
  Natural: '#f2c998', Toffee: '#c17c44', Sand: '#b49a7d', Latte: '#a68a6c', Storm: '#8c7e79', Slate: '#5d5860', Charcoal: '#3f312e', Java: '#6b2f1e', Pecan: '#271005', Espresso: '#1b1615', Unfinished: '#e8d5b5',
  'Bright White Brushed Gray Glaze': '#f4f4f4', 'Willow Gray Brushed Gray Glaze': '#c1bcb6' };
for (const [id, mats] of [['haze', [M.box, M.front, M.base]], ['alabaster', [M.alabaster]]]) { // Haze on the base cabinets, Alabaster on the tall items and uppers
  const sel = document.getElementById('paint-' + id);
  sel.innerHTML = Object.keys(PAINTS).map(n => `<option>${n}</option>`).join('');
  sel.value = id[0].toUpperCase() + id.slice(1);
  sel.onchange = () => mats.forEach(m => m.color.set(PAINTS[sel.value]));
}
document.getElementById('small').onchange = e => small.visible = e.target.checked;
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => show(b.dataset.view));
const start = location.hash.slice(1); // index.html links straight to a view: model.html#island
show(Object.hasOwn(views, start) ? start : 'end');

const resize = () => {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight - document.querySelector('header').offsetHeight;
  renderer.setSize(w, h, false); // CSS sets the width, so a phone's layout viewport can't grow with the canvas
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
};
// Slab photos on the stone, as on docs/countertop-2.html's cutting maps: photo, slab size, and each piece's corner (x, y inside the 1" trim);
// the cooktop piece on the first slab, the rest on the second; front edges toward the slab's bottom, the backsplash above the wall piece.
const SLABS = {
  ebano:    { name: 'Ebano', img: 'ebano', w: 132, h: 79, cooktop: [45, 32.5], sink: [0, 46.5], wall: [0, 21.5], splash: [0, 3.25] },
  maestro:  { name: 'Maestro', img: 'maestro', w: 122, h: 77, cooktop: [35, 30.5], sink: [0, 44.5], wall: [0, 19.5], splash: [0, 1.25] },
  aurora:   { name: 'Aurora Borealis', img: 'aurora', w: 124, h: 78.75, cooktop: [37, 32.25], sink: [0, 46.25], wall: [0, 21.25], splash: [0, 3] },
  azulatto: { name: 'Bianco Azulatto', img: 'azulatto', w: 125.5, h: 77, cooktop: [38.5, 30.5], sink: [0, 44.5], wall: [0, 19.5], splash: [0, 1.25] },
  explosion: { name: 'Explosion Blue', img: 'explosion-blue', w: 124, h: 78.75, cooktop: [37, 32.25], sink: [0, 46.25], wall: [0, 21.25], splash: [0, 3] },
  taj:      { name: 'Taj Mahal', img: 'taj-mahal', w: 129, h: 77.75, cooktop: [42, 31.25], sink: [0, 45.25], wall: [0, 20.25], splash: [0, 2] },
};
const seam = island.find((c, k) => k && (c.back ?? DIMS.islandBack) !== (island[k - 1].back ?? DIMS.islandBack)).u;
const piece = m => m === splash ? 'splash' : m.parent === runs.wall ? 'wall' : m.position.x < seam ? 'cooktop' : 'sink';
const ext = {}; // each piece's min and max corners
for (const m of stone) {
  const e = ext[piece(m)] ??= [[Infinity, Infinity, Infinity], [-Infinity, -Infinity, -Infinity]];
  for (const a of [0, 1, 2]) {
    e[0][a] = Math.min(e[0][a], m.position.getComponent(a) - m.scale.getComponent(a) / 2);
    e[1][a] = Math.max(e[1][a], m.position.getComponent(a) + m.scale.getComponent(a) / 2);
  }
}
const loader = new THREE.TextureLoader(), slabMats = {};
const slabMat = (img, n) => slabMats[img + n] ??= new THREE.MeshStandardMaterial({ roughness: 0.3,
  map: Object.assign(loader.load(SLAB_PHOTOS[img][n - 1]), { colorSpace: THREE.SRGBColorSpace, anisotropy: renderer.capabilities.getMaxAnisotropy() }) });
const photos = img => new Promise((ok, fail) => { // ../docs/<img>-slabs.js: the photos as data URIs, since WebGL can't use a .jpg opened from file:
  if (self.SLAB_PHOTOS?.[img]) return ok();
  document.head.append(Object.assign(document.createElement('script'), { src: `../docs/${img}-slabs.js`, onload: ok, onerror: fail }));
});
const setSlab = async key => {
  const s = SLABS[key];
  if (s) await photos(s.img);
  if (key !== slab.value) return; // picked another while loading
  splash.visible = !!s;
  for (const [plate, face] of onSplash) { plate.visible = !s; face.visible = !!s; }
  for (const m of stone) {
    if (!s) { m.material = M.counter; continue; }
    const k = piece(m), [px, py] = s[k], [lo, hi] = ext[k];
    if (m.geometry === geo) m.geometry = geo.clone();
    const p = m.geometry.attributes.position, uv = m.geometry.attributes.uv;
    for (let i = 0; i < p.count; i++) { // inches from the piece's left end (as seen from the aisle) and its back edge (the backsplash: its top); sides take the nearest stone
      const x = m.position.x + p.getX(i) * m.scale.x, y = m.position.y + p.getY(i) * m.scale.y, z = m.position.z + p.getZ(i) * m.scale.z;
      const [a, d] = k === 'wall' ? [hi[0] - x, hi[2] - z] : k === 'splash' ? [hi[0] - x, hi[1] - y] : [x - lo[0], z - lo[2]];
      uv.setXY(i, (1 + px + a) / s.w, 1 - (1 + py + d) / s.h);
    }
    uv.needsUpdate = true;
    m.material = slabMat(s.img, k === 'cooktop' ? 1 : 2);
  }
  try { localStorage.setItem('model-slab', key); } catch {}
};
const slab = document.getElementById('slab');
for (const k in SLABS) slab.add(new Option(SLABS[k].name, k));
try { const k = localStorage.getItem('model-slab'); if (Object.hasOwn(SLABS, k)) slab.value = k; } catch {}
slab.onchange = () => setSlab(slab.value);
setSlab(slab.value);

addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
