<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../nav.js" defer></script>
<link rel="stylesheet" href="../theme-light.css">
<title>Sketches · Galley Kitchen</title>
<script src="../kitchen.js"></script>
<script src="sketch.js"></script>
<body>
<h1>Sketches</h1>
<p><a href="../index.html">index</a> · <a href="#wall-front">Wall front</a> · <a href="#wall-top">Wall top</a> · <a href="#island-front">Island front</a> · <a href="#island-top">Island top</a> · <a href="#house">House</a></p>
<script>
// The runs are in ../kitchen.js. Each run's front, then its plan under it; the plans mark the work areas and the lights.
const { island, wall } = RUNS;
for (const run of [island, wall]) { let u = 0; for (const c of run) { c.u = u; u += c.w; } } // each plan needs the other run's positions too
const I = Object.fromEntries(island.map(c => [c.name, c])), Wl = Object.fromEntries(wall.filter(c => c.name).map(c => [c.name, c]));
const mid = (a, b = a) => (a.u + b.u + b.w) / 2; // middle of a, or of a through b
const wallLen = wall.reduce((s, c) => s + c.w, 0);
// A lights down the middle of the aisle, between each pair of opposite centers (the wall run faces the island, so its u runs the other way).
const A = [['cooktop', 'Air Fryer'], ['trash', 'Oven'], ['dishwasher', 'Fridge']].map(([a, b]) => (mid(I[a]) + wallLen - mid(Wl[b])) / 2);
const AISLE_MID = DEPTH + FRONT + AISLE / 2;
const legend = (svg, people) => svg.insertAdjacentHTML('beforebegin', `<p class="lights"><label><input type="checkbox" data-light="T"> <b class="legend">T</b> task light (ceiling spot; shadows figured from the ceiling)</label><label><input type="checkbox" data-light="A"> <b class="legend">A</b> ambient light</label>
  <label><input type="checkbox" data-light="X"> <b class="legend">X</b> accent light (toe kick, inside the glass cabinets)</label><label><input type="checkbox" data-light="UC"> <b class="legend">UC</b> under-cabinet light</label>${people ? '<label><input type="checkbox" data-light="people"> 74" people</label>' : ''}</p>`);

sketch('Wall front', wall, { toggles: true, walls: true }); // stud wall at the right end
const wallTop = plan('Wall top', wall, { extra: ({ text, x, y }) => {
  const wal = (u, v, s, cls) => text(x(u), y(v) + 1, s, cls);
  wal(mid(Wl.Coffee), COUNTER + 6, 'coffee', 'zone');
  wal((mid(Wl.Toaster) + mid(Wl['Air Fryer'])) / 2, COUNTER + 6, 'oven landing', 'zone');
  for (const c of wall) if ((c.upper || []).some(x => x.code === 'W2127')) {
    wal(mid(c), 5, 'wall cabinet', 'code on');
    wal(mid(c), 10, 'UC', 'lamp l-UC'); // under-cabinet light, near the front
  }
  for (const u of A) wal(wallLen - u, AISLE_MID, 'A', 'lamp l-A');
  // X: toe-kick lights in front of each cabinet (not the appliance gaps or panels).
  for (const c of wall) if (!['gap', 'panel'].includes(c.kind)) wal(mid(c), COUNTER + 2.5, 'X', 'lamp l-X');
  // X: Nicor bars inside the glass cabinets at the top of the wall run (2026-10-31).
  for (const c of wall) if ((c.upper || []).some(x => / glass$/.test(x.code))) { wal(mid(c), 16, 'X', 'lamp l-X'); wal(mid(c), 19.5, 'glass cabinet', 'code on'); }
} });
legend(wallTop);

sketch('Island front', island);
const islandTop = plan('Island top', island, { island: true, extra: ({ out, text, x: ix, y: iy }) => {
  const isl = (u, v, s, cls) => text(ix(u), iy(v) + 1, s, cls);
  text(ix(96), 6, 'guest facing side', 'name');
  // Areas, in the aisle in front of each counter.
  for (const [a, b, s] of [['spices', , 'landing'], ['cooktop', , 'cooktop'], ['plates', 'trash', 'prep'], ['sink', , 'sink'],
    ['dishwasher', , 'dish unload'], ['cabinet a', , 'fridge loading']]) isl(mid(I[a], I[b || a]), COUNTER + 6, s, 'zone');
  isl(mid(I.cooktop), COUNTER + 9, 'vent hood', 'code');
  // Three counter stools at the seating overhang, 28" apart along the 84" stretch, tucked in 3 1/2" from the back wall; 16" round seats (stools not chosen, size assumed).
  for (const u of DIMS.stools) {
    out.push(`<circle class="hidden" cx="${ix(u)}" cy="${iy(-16)}" r="8"/>`);
    isl(u, -16, 'stool', 'code on');
  }
  // Lights in island [u, v]: T over the island counter, A down the middle of the aisle.
  const T = [mid(I.spices), I.trash.u, mid(I.sink), I['cabinet a'].u].map(u => [u, 18]);
  const AL = A.map(u => [u, AISLE_MID]);
  // People 74" tall facing the island, belly 3" off the counter front, seen from above. Each light (at the 96" ceiling, assumed)
  // throws the body's slices (waist at the counter, shoulders, head) onto the counter; the shadow is their hull, clipped to the counter.
  const people = [mid(I.plates, I.trash), mid(I.sink)];
  const slices = u => [[7, 5, COUNTER + 8, TOP + BOX], [9.5, 5.5, COUNTER + 8, 61], [3.25, 4, COUNTER + 7, 74]] // rx, ry, center v, height (assumed proportions)
    .flatMap(([rx, ry, v, h]) => Array.from({ length: 16 }, (_, k) => [u + rx * Math.cos(k * Math.PI / 8), v + ry * Math.sin(k * Math.PI / 8), h]));
  const onCounter = ([lu, lv], [u, v, h]) => { const t = (CEILING - TOP - BOX) / (CEILING - h); return [lu + (u - lu) * t, lv + (v - lv) * t]; };
  const hull = ps => { // monotone chain
    ps.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]), h = [];
    for (const pass of [ps, [...ps].reverse()]) {
      const s = h.length;
      for (const p of pass) { while (h.length >= s + 2 && cr(h[h.length - 2], h[h.length - 1], p) <= 0) h.pop(); h.push(p); }
      h.pop();
    }
    return h;
  };
  out.push(`<clipPath id="counter"><rect x="${ix(-1)}" y="${iy(-DIMS.seat)}" width="${island.reduce((s, c) => s + c.w, 2)}" height="${COUNTER + 19.5}"/></clipPath>`);
  for (const u of people) for (const [L, k] of [...T.map(L => [L, 'T']), ...AL.map(L => [L, 'A'])]) // class l-T / l-A: hidden with its light
    out.push(`<polygon class="shadow l-${k}" clip-path="url(#counter)" points="${hull(slices(u).map(p => onCounter(L, p))).map(([u, v]) => `${ix(u)},${iy(v)}`).join(' ')}"/>`);
  for (const u of people) {
    out.unshift(`<ellipse class="person l-people" cx="${ix(u)}" cy="${iy(COUNTER + 8)}" rx="9.5" ry="5.5"/><ellipse class="person head l-people" cx="${ix(u)}" cy="${iy(COUNTER + 7)}" rx="3.25" ry="4"/>`);
    isl(u, 41, '74" person', 'code l-people');
  }
  // Refinement sheet (2026-10-31): arrows from the two lights each working position relies on (the T over its counter, the A behind) to the head.
  out.push('<marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e07000"/></marker>');
  const ray = ([u0, v0], [u1, v1], cls) => out.push(`<line class="ray ${cls}" x1="${ix(u0)}" y1="${iy(v0)}" x2="${ix(u1)}" y2="${iy(v1)}" marker-end="url(#arrow)"/>`);
  for (const [u, t, a] of [[people[0], T[1], AL[1]], [people[1], T[2], AL[1]]]) { ray([t[0], t[1] + 2], [u, COUNTER + 4], 'l-T'); ray([a[0], a[1] - 2], [u, COUNTER + 11], 'l-A'); }
  out.push(`<line class="ray guest" x1="${ix(168)}" y1="8" x2="${ix(168)}" y2="${iy(-12)}" marker-end="url(#arrow)"/>`);
  text(ix(150), 6, 'guest view: exposed LEDs, hood glare, fixture in the sightline?', 'code');
  for (const [u, v] of T) isl(u, v, 'T', 'lamp l-T');
  for (const [u, v] of AL) isl(u, v, 'A', 'lamp l-A');
  // X: toe-kick lights in front of each cabinet (not the appliance gaps or panels).
  for (const c of island) if (c.kind !== 'gap') isl(mid(c), COUNTER + 2.5, 'X', 'lamp l-X');
} });
legend(islandTop, true);
islandTop.insertAdjacentHTML('beforebegin', `<p><b style="color: var(--green)">green</b>: work areas ·
  gray: shadow each light (at the 96" ceiling) casts on the counter from a 74" person (checked: light on)</p>
  <style>.legend { color: #e07000; } .lights label { display: block; } .zone, .lamp { paint-order: stroke; stroke: var(--sheet); stroke-width: 0.6; } .shadow { fill: #000; fill-opacity: 0.15; } .person { fill: var(--muted); fill-opacity: 0.85; } .head { fill: var(--ink); }
  svg .off, svg:has(.person.off) .shadow { display: none; }
  .ray { stroke: #e07000; stroke-width: 0.5; } .ray.guest { stroke: var(--green); }</style>
  <p>Arrows: the two lights over each working position, aimed at the head (74"). Prep: T over the counter ahead, A in the aisle behind; their coverage overlaps on the counter. <a href="../docs/lighting.html">Lighting</a></p>`);
// A light turned off hides its marks, arrows and shadows; people turned off hide themselves and all the shadows.
// Each plan has its own checkboxes; a box sets its twin in the other plan.
for (const box of document.querySelectorAll('[data-light]')) {
  const k = box.dataset.light;
  box.onchange = () => {
    for (const b of document.querySelectorAll(`[data-light="${k}"]`)) b.checked = box.checked;
    document.querySelectorAll(`svg .l-${k}`).forEach(el => el.classList.toggle('off', !box.checked));
  };
  box.onchange();
}

// House: the floor plan with the kitchen in place. Page x = OX + x, page y = OY + y, inches from the inside faces of the outer wall (left) and the top wall.
{
  const OX = 55, OY = 17;
  // Traced from the floor plan drawing (since deleted), to the nearest 1/2". [x1, y1, x2, y2, marks across the wall along its length]
  const WALLS = [
    [-5, -5, 383.5, 0, [10, 81, 88, 150.5, 161, 231, 293.5, 342]],
    [-5, -5, 0, 452.5, [80, 127, 225.5, 231, 302.5, 309.5]],
    [-16, 225.5, -5, 309.5, [231, 302.5]],
    [-5, 447, 247, 452.5],
    [383.5, 0, 388.5, 143, [88, 134.5]],
    [245.5, -5, 250.5, 143],
    [250.5, 138, 343, 143],
    [375, 138, 422.5, 143],
    [455.5, 138, 583.5, 143, [530, 556.5]],
    [460.5, 138, 466, 148],
    [578.5, 138, 583.5, 454.5, [191, 239]],
    [293.5, 449.5, 583.5, 454.5, [340.5, 410.5]],
    [293.5, 330.5, 299, 454.5],
    [465.5, 334, 471, 454.5],
    [465.5, 287, 471, 310],
    [299, 287, 583.5, 292],
    [293.5, 182, 299, 296.5, [234.5, 270]],
    [299, 182, 342.5, 187.5, [301.5, 323.5]],
    [336.5, 187.5, 342.5, 287],
    [364.5, 182, 379, 187.5],
    [374, 187.5, 379, 223.5],
    [374, 218, 461, 223.5],
    [455.5, 182, 461, 287],
    [460.5, 177, 466, 187.5],
    [247, 417, 299, 422],
    [241.5, 405.5, 247, 452.5],
    [109, 429, 114, 447.5],
  ];
  // The existing kitchen walls: the 165", 106" and 136" walls with the 38" stubs as one outline, then the 65" wall, open at the outer wall.
  const OLD_WALLS = 'M77 198.5H247.5V347H242V314.5H106V281.5H111V309.5H149V281.5H154V309.5H242V203.5H77Z M0 309.5H65V314.5H0';
  const SPICES = 48 + 5.5, BACKS = 203.5; // the spices cabinet's left edge from the outer wall; the island's cabinet backs, on the kitchen face of the old 165" wall, from the top wall

  const out = [`<style>
    .house-wall { fill: var(--sheet); stroke: var(--ink); stroke-width: 0.6; } .house-mark { stroke: var(--ink); stroke-width: 0.4; }
    .old-wall { fill: none; stroke: #ff4fa3; stroke-width: 0.75; stroke-dasharray: 3 2; }
    .kit text, .kit .dimline, .kit .tick { display: none; }
    .house-notes text { font-size: 4.4px; } .house-notes line { stroke: var(--ink); stroke-width: 0.4; }
  </style>`];
  for (const [x1, y1, x2, y2, marks = []] of WALLS) {
    out.push(`<rect x="${OX + x1}" y="${OY + y1}" width="${x2 - x1}" height="${y2 - y1}" class="house-wall"/>`);
    for (const m of marks) out.push(x2 - x1 > y2 - y1
      ? `<line x1="${OX + m}" y1="${OY + y1}" x2="${OX + m}" y2="${OY + y2}" class="house-mark"/>`
      : `<line x1="${OX + x1}" y1="${OY + m}" x2="${OX + x2}" y2="${OY + m}" class="house-mark"/>`);
  }

  const place = `translate(${OX + SPICES} ${OY + BACKS})`, n = wallLen, ZWALL = 2 * (DEPTH + FRONT) + AISLE; // ZWALL: the room wall's face from the island's cabinet backs
  const islandShapes = plan('', island, { island: true, raw: true }), wallShapes = plan('', wall, { raw: true });
  const stools = DIMS.stools.map(u => `<circle class="hidden" cx="${MARGIN + u}" cy="${islandShapes.oy - 16}" r="8"/>`);
  out.push(`<g class="kit" transform="${place}">
    <g transform="translate(${-MARGIN} ${-islandShapes.oy})">${islandShapes.out.join('')}${stools.join('')}</g>
    <g transform="translate(${n} ${ZWALL}) rotate(180) translate(${-MARGIN} ${-wallShapes.oy})">${wallShapes.out.join('')}</g>
  </g>`);
  out.push(`<path d="${OLD_WALLS}" transform="translate(${OX} ${OY})" class="old-wall"/>`);

  // Notes, in inches: x from the spices cabinet's left edge, y from the island's cabinet backs.
  const notes = [];
  const label = (x, y, s) => notes.push(`<text x="${x}" y="${y}">${s}</text>`);
  const seg = (x1, y1, x2, y2) => notes.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`);
  const dim = (x1, y1, x2, y2, s) => {
    const [tx, ty] = x1 === x2 ? [2, 0] : [0, 2]; // end ticks, across the line
    seg(x1, y1, x2, y2);
    for (const [x, y] of [[x1, y1], [x2, y2]]) seg(x - tx, y - ty, x + tx, y + ty);
    label((x1 + x2) / 2 + (x1 === x2 ? 8 : 0), (y1 + y2) / 2 + (x1 === x2 ? 1.5 : -1.5), s); // beside the line
  };
  for (const c of island) if (c.name) label(c.u + c.w / 2, COUNTER + 5, c.name);
  for (const c of wall) if (c.name) label(n - c.u - c.w / 2, ZWALL - 32.5, c.name);
  dim(-SPICES, 12, 0, 12, `${inch(SPICES)}"`);
  dim(0, -28, DIMS.islandLen, -28, `${inch(DIMS.islandLen)}"`);
  dim(0, ZWALL + WALL + 8, n, ZWALL + WALL + 8, `${inch(n)}"`);
  dim(-SPICES, ZWALL + WALL + 8, -WALL, ZWALL + WALL + 8, `${inch(SPICES - WALL)}" opening`); // the 65" wall, opened from the outer wall to the side wall
  label(85.5 - SPICES, ZWALL + WALL + 14, '41" doorway closed'); // 65" to 106" from the outer wall
  dim(205, DEPTH + FRONT, 205, ZWALL - DEPTH - FRONT, `${inch(AISLE)}"`);
  const DX = -SPICES - 43; // the 447" dimension, left of the bay
  for (const y of [-BACKS, 447 - BACKS]) seg(DX - 2, y, -SPICES - 5, y); // extension lines to the outer wall
  dim(DX, -BACKS, DX, 447 - BACKS, '447"');
  out.push(`<g class="house-notes" transform="${place}">${notes.join('')}</g>`);

  page('House', 'Floor plan with the kitchen in place; existing kitchen walls dashed pink', OX + 583.5 + 12, OY + 454.5 + 12, OY, out, ['from the outer wall', 'from the top wall', -1, OX]);
}
</script>
