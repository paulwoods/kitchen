<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Same runs as sketch-island-front.html and sketch-wall-front.html, left to right as seen from the aisle. Inches.
const island = [
  { code: 'DB24-3',  w: 24, kind: 'drawers', n: 3, back: 6.75, backReceptacle: true },
  { code: 'DB36-3',  w: 36, kind: 'drawers', n: 3, cooktop: true, back: 6.75,
    upper: [ { hood: true, w: 41.5, h: 2, at: 66.1875, chimney: 13.375, chimneyD: 10.625 } ] }, // Proline PLFI 544-42
  { code: 'DB24-3',  w: 24, kind: 'drawers', n: 3, back: 6.75, backReceptacle: true },
  { code: 'TRB18FH', w: 18, kind: 'door', backReceptacle: true },
  { code: 'SB42',    w: 42, kind: 'sink', airSwitch: { dx: 17, back: 3 },
    sink: { w: 31.875, d: 17.375, v: 4.8125, depth: 9.875, ledge: 0.6875, drain: 11.3125 }, // Ruvati RVH6222ST bowl opening (centered in its 33.5" x 19" outline, 2" from the counter front), drain 6 1/4" in from the left wall
    faucet: { h: 22.4375, reach: 9.5, back: 3 } }, // Kohler K-R30937-BMB
  { code: '24" gap', w: 24, kind: 'gap', tag: 'DW', backReceptacle: true },
  { code: 'B24-2',   w: 24, kind: 'base', backReceptacle: true },
];
const wall = [
  { code: 'TEP',     w: 1.5, kind: 'panel', h: 96 },
  { code: '36" gap', w: 36,  kind: 'gap', h: 70, tag: 'REF', receptacle: true, d: 28.5,
    upper: [{ code: 'W362424', h: 24, at: 72 }] },
  { code: 'TEP',     w: 1.5, kind: 'panel', h: 96 },
  { code: 'PC36',    w: 36,  kind: 'pantry', h: 84, upper: [{ code: 'W361224', h: 12, at: 84, glass: true }] },
  { code: 'filler',  w: 1.5, kind: 'panel', h: 96 },
  { code: 'B33',     w: 33,  kind: 'oven', receptacle: true,
    upper: [{ light: 'UCB133SNWH', w: 33, h: 1.1, at: 52.9 }, { code: 'W3330', h: 30, at: 54 }, { code: 'W3312', h: 12, at: 84, glass: true }] },
  { code: 'filler',  w: 1.5, kind: 'filler', upper: [{ filler: true, at: 54, h: 42 }] },
  { code: 'MWB27',   w: 27,  kind: 'microwave', receptacle: true,
    upper: [{ appliance: 'toaster oven', w: 21.5, h: 12.7, at: 35.75 }, { light: 'UCB124SNWH', w: 24, h: 1.1, at: 52.9 }, { code: 'W2730', h: 30, at: 54 }, { code: 'W2712', h: 12, at: 84, glass: true }] },
  { code: 'DB27-3',  w: 27,  kind: 'drawers', n: 3, receptacle: true,
    upper: [{ appliance: 'air fryer', w: 11, h: 14.75, at: 35.75 }, { light: 'UCB124SNWH', w: 24, h: 1.1, at: 52.9 }, { code: 'W2730', h: 30, at: 54 }, { code: 'W2712', h: 12, at: 84, glass: true }] },
  { code: 'DB27-3',  w: 27,  kind: 'drawers', n: 3, receptacle: true,
    upper: [{ coffee: true, w: 8.5, h: 16.3, at: 35.75 }, { light: 'UCB124SNWH', w: 24, h: 1.1, at: 52.9 }, { code: 'W2730', h: 30, at: 54 }, { code: 'W2712', h: 12, at: 84, glass: true }] },
];

const TOE = 4.5, BOX = 34.5, TOP = 1.25, CEILING = 96, OUTLET = 44; // OUTLET: center of a wall receptacle (assumed)
const DEPTH = 24, COUNTER = 25, AISLE = 48, UPPER = 12, APPLIANCE = 14, HOOD = 23.625; // appliance depth assumed; hood depth per the Proline sheet
const total = 192;
const ZWALL = 2 * DEPTH + AISLE; // the island's back is at z = 0, the room wall at ZWALL

const scene = new THREE.Scene();
scene.background = new THREE.Color('#fbfaf5');
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
const M = {
  box: mat('#f4f4f3'), front: mat('#f4f4f3'), naval: mat('#253140'), // Monaco Bright White; Monaco Naval on the base cabinets
  toe: mat('#556'), counter: mat('#ecebe6', { roughness: 0.3 }),
  steel: mat('#c9ccd2', { metalness: 0.5, roughness: 0.4 }), black: mat('#1b1b1b', { roughness: 0.3 }), brass: mat('#b08d57', { metalness: 0.6, roughness: 0.35 }),
  glass: mat('#bcd7e8', { transparent: true, opacity: 0.5 }), ring: mat('#8a8f99', { roughness: 0.4 }), drain: mat('#4a4d52', { metalness: 0.5, roughness: 0.4 }), pull: mat('#2b2b2b'), plate: mat('#ffffff'),
  hoodGlass: mat('#bcd7e8', { transparent: true, opacity: 0.4, side: THREE.DoubleSide, roughness: 0.1 }), light: mat('#fff6d8', { emissive: '#fff1c0' }), wall: mat('#e9e4d8'), ply: mat('#d9b98a'), floor: mat('#c8b48f'),
};
const edges = new THREE.LineBasicMaterial({ color: '#223', transparent: true, opacity: 0.35 });
const geo = new THREE.BoxGeometry(1, 1, 1), edgeGeo = new THREE.EdgesGeometry(geo);
let group = scene; // where cube() and rod() put things
const cube = (x, y, z, w, h, d, m) => { // min corner, size
  const mesh = new THREE.Mesh(geo, m);
  mesh.scale.set(w, h, d);
  mesh.position.set(x + w / 2, y + h / 2, z + d / 2);
  mesh.add(new THREE.LineSegments(edgeGeo, edges));
  group.add(mesh);
};
const rod = (a, b, r, m) => { // cylinder from point a to point b
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 16), m);
  mesh.position.copy(A).add(B).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  group.add(mesh);
};
const ring = (p, r, m) => { // flat ring centered at p
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(r, 0.08, 6, 48), m);
  mesh.position.set(...p);
  mesh.rotation.x = Math.PI / 2;
  group.add(mesh);
};

// One run in its own coordinates: u along the run from its left end, v from the cabinet backs toward the aisle, y up from the floor.
// The island faces +z from its back at zBack; the wall run faces -z from the wall and reads right to left.
function side(run, flip, zBack, back = 0, naval = true) { // back: counter past the cabinet backs (an item's own `back` wins); naval: base-height items in Monaco Naval, else Bright White
  const B = (u, v, y, w, d, h, m) => cube(flip ? total - u - w : u, y, flip ? zBack - v - d : zBack + v, w, h, d, m);
  const P = (u, v, y) => [flip ? total - u : u, y, flip ? zBack - v : zBack + v];

  // Stack of fronts from `top` down, on the face at v; each row is { h, pair, pull: 'mid' | 'top' | 'bottom', glass }.
  const fronts = (u, w, top, rows, v = DEPTH) => {
    let y = top;
    for (const r of rows) {
      const m = base ? M.naval : M.front, y0 = y - r.h + 0.125, h = r.h - 0.25;
      const door = (du, dw) => {
        if (!r.glass) return B(du, v, y0, dw, 0.75, h, m);
        const f = 2.25; // glass door: a frame 2 1/4" wide (assumed) around a pane set back in it
        for (const fx of [du, du + dw - f]) B(fx, v, y0, f, 0.75, h, m);
        for (const fy of [y0, y0 + h - f]) B(du + f, v, fy, dw - 2 * f, 0.75, f, m);
        B(du + f, v + 0.25, y0 + f, dw - 2 * f, 0.125, h - 2 * f, M.glass);
      };
      if (r.pair) {
        door(u + 0.125, w / 2 - 0.1875);
        door(u + w / 2 + 0.0625, w / 2 - 0.1875);
        const py = r.pull === 'bottom' ? y - r.h + 2 : y - 6;
        for (const px of [u + w / 2 - 1.75, u + w / 2 + 1.25]) B(px, v + 0.75, py, 0.5, 0.75, 4, base ? M.brass : M.pull); // gold pulls on the base cabinets
      } else {
        door(u + 0.125, w - 0.25);
        B(u + w / 2 - 2, v + 0.75, r.pull === 'top' ? y - 3 : y - r.h / 2, 4, 0.75, 0.5, base ? M.brass : M.pull);
      }
      y -= r.h;
    }
  };
  let base = false; // drawing a base-height item
  const cabinet = (u, w, h) => { B(u, 0, TOE, w, DEPTH, h - TOE, base ? M.naval : M.box); B(u, 0, 0, w, DEPTH - 3, TOE, M.toe); };

  let u = 0;
  for (const c of run) { c.u = u; u += c.w; }
  const face = BOX - TOE;
  for (const c of run) {
    const { u, w } = c;
    base = naval && !c.h;
    if (c.kind === 'gap' && c.h) { // fridge: stainless box c.d deep, French doors over a freezer drawer
      const d = c.d || DEPTH;
      B(u + 0.25, 0, 0, w - 0.5, d, c.h, M.steel);
      B(u + w / 2 - 0.1, d, 30, 0.2, 0.1, c.h - 30, M.black);
      B(u + 0.25, d, 30, w - 0.5, 0.1, 0.2, M.black);
      for (const px of [u + w / 2 - 2.5, u + w / 2 + 2]) B(px, d + 0.5, 40, 0.5, 1, 24, M.steel);
      B(u + 4, d + 0.5, 25, w - 8, 1, 0.5, M.steel);
    } else if (c.kind === 'gap') { // dishwasher: panel-ready front over a toe kick
      B(u, 0, 0, w, DEPTH - 3, TOE, M.toe);
      fronts(u, w, BOX, [{ h: face, pull: 'top' }]);
    } else if (c.kind === 'panel') {
      B(u, 0, 0, w, DEPTH + 0.75, c.h, M.box);
    } else if (c.kind === 'pantry') {
      cabinet(u, w, c.h);
      fronts(u, w, c.h, [{ h: c.h - TOE - face, pair: true, pull: 'bottom' }, { h: face, pair: true, pull: 'top' }]);
    } else if (c.sink) { // open above the bowl's bottom: sides and back only, so the bowl shows
      const y = BOX - c.sink.depth - 0.5;
      cabinet(u, w, y);
      for (const x of [u, u + w - 0.75]) B(x, 0, y, 0.75, DEPTH, BOX - y, M.naval);
      B(u, 0, y, w, 0.75, BOX - y, M.naval);
      fronts(u, w, BOX, [{ h: 6 }, { h: face - 6, pair: true }]);
    } else {
      cabinet(u, w, BOX);
      if (c.kind === 'drawers') {
        const rest = (face - 6) / (c.n - 1);
        fronts(u, w, BOX, [{ h: 6 }, ...Array(c.n - 2).fill({ h: rest }), { h: rest, pull: 'top' }]);
      } else if (c.kind === 'door') fronts(u, w, BOX, [{ h: face, pull: 'top' }]);
      else if (c.kind === 'base') fronts(u, w, BOX, [{ h: 6 }, { h: face - 6, pull: 'top' }]);
      else if (c.kind === 'filler') B(u, DEPTH, TOE, w, 0.75, face, base ? M.naval : M.front);
      else if (c.kind === 'oven') { // 29" oven face from 5" to 34" off the floor
        const ow = Math.min(29.75, w - 0.25), ou = u + (w - ow) / 2;
        B(ou, DEPTH, 5, ow, 0.75, 29, M.steel);
        B(ou + 3, DEPTH + 0.75, 10, ow - 6, 0.1, 18, M.black);
        B(ou + 3, DEPTH + 1, 31, ow - 6, 1, 0.75, M.steel);
      } else if (c.kind === 'microwave') { // Bosch HMD8454UC microwave drawer: 23 7/8" x 16 5/16" face from 17.75" to 34 1/16", one drawer below (like the cabinets.com MBC27)
        fronts(u, w, 17.75, [{ h: 13.25 }]);
        const mw = 23.875, mu = u + (w - mw) / 2;
        B(mu, DEPTH, 17.75, mw, 0.75, 16.3125, M.steel);
        B(mu + 0.5, DEPTH + 0.75, 31.875, mw - 1, 0.1, 1.6875, M.black); // control strip
      }
    }
    if (c.receptacle) { // vertical duplex plate (assumed) at OUTLET on the wall
      B(u + (w - 2.75) / 2, 0, OUTLET - 2.25, 2.75, 0.25, 4.5, M.plate);
    }
    if (c.backReceptacle) { // vertical duplex plate on the island's plywood back, centered at 30" (height assumed)
      B(u + (w - 2.75) / 2, -1, 29 - 2.25, 2.75, 0.25, 4.5, M.plate);
    }
    if (c.airSwitch) { // InSinkErator STS-OO disposal air button: chrome collar and white button (size assumed)
      const p = (y) => P(u + c.airSwitch.dx, c.airSwitch.back, y);
      rod(p(BOX + TOP), p(BOX + TOP + 0.25), 0.875, M.steel);
      rod(p(BOX + TOP + 0.25), p(BOX + TOP + 0.75), 0.6, M.plate);
    }
    if (c.cooktop) { // Bosch NIT8061UC: black glass, four zones, touch-control strip at the front (layout as in the top view)
      const cu = u + (w - 31) / 2, cv = (COUNTER - 21.25) / 2 - 2, // 2" back from centered on the 25" counter (2026-10-27)
        y = BOX + TOP + 0.25;
      B(cu, cv, BOX + TOP, 31, 21.25, 0.25, M.black);
      for (const [du, dv] of [[8, 6], [23, 6], [8, 15.25], [23, 15.25]]) ring(P(cu + du, cv + dv, y + 0.02), 4, M.ring);
      B(cu + 8, cv + 19.25, y, 15, 1, 0.02, M.ring);
    }
    if (c.sink) { // Ruvati RVH6222ST undermount, under a cutout in the counter (see below): open steel bowl, workstation ledges front and back, drain on the left
      const s = c.sink, su = u + (w - s.w) / 2, sv = s.v, y = BOX;
      B(su, sv, y - s.depth, s.w, s.d, 0.1, M.steel); // bottom (flat; really slopes 9 7/8" to 9 1/4")
      B(su, sv, y - s.depth, 0.1, s.d, s.depth, M.steel);
      B(su + s.w - 0.1, sv, y - s.depth, 0.1, s.d, s.depth, M.steel);
      B(su, sv, y - s.depth, s.w, 0.1, s.depth, M.steel);
      B(su, sv + s.d - 0.1, y - s.depth, s.w, 0.1, s.depth, M.steel);
      for (const lv of [sv, sv + s.d - s.ledge]) B(su, lv, y - 1, s.w, s.ledge, 0.1, M.steel); // ledges the accessories ride on
      rod(P(u + s.drain, sv + s.d / 2, y - s.depth + 0.1), P(u + s.drain, sv + s.d / 2, y - s.depth + 0.2), 1.75, M.drain);
    }
    if (c.faucet) { // Kohler spec sheet: a 13" column (from the drawing), the exposed spring arching up to h and over to the sprayhead
      // (9 1/2" clear under it) on a brass dock arm; side lever on a hub off the right side. Brass trim per the product photo
      const f = c.faucet, y0 = BOX + TOP, cu = u + w / 2, fv = f.back + f.reach, R = f.reach / 2, cy = y0 + f.h - 0.6 - R;
      rod(P(cu, f.back, y0), P(cu, f.back, y0 + 0.5), 1.25, M.black); // base
      rod(P(cu, f.back, y0), P(cu, f.back, y0 + 13), 0.65, M.black);
      const path = new THREE.CurvePath(); // spring centerline: up from the column, a half circle over, down to the sprayhead
      path.add(new THREE.LineCurve3(new THREE.Vector3(...P(cu, f.back, y0 + 13)), new THREE.Vector3(...P(cu, f.back, cy))));
      path.add(new THREE.CatmullRomCurve3(Array.from({ length: 17 }, (_, i) => { const t = Math.PI * (1 - i / 16);
        return new THREE.Vector3(...P(cu, f.back + R * (1 + Math.cos(t)), cy + R * Math.sin(t))); })));
      path.add(new THREE.LineCurve3(new THREE.Vector3(...P(cu, fv, cy)), new THREE.Vector3(...P(cu, fv, y0 + 14))));
      group.add(new THREE.Mesh(new THREE.TubeGeometry(path, 200, 0.3, 8), M.black)); // hose
      const len = path.getLength(), turns = Math.round(len / 0.5), side = new THREE.Vector3(1, 0, 0), coil = [];
      for (let i = 0; i <= turns * 16; i++) { // helix around the centerline (the run is along x, so x is always square to the arch)
        const s = i / (turns * 16), p = path.getPointAt(s), n = path.getTangentAt(s).cross(side), a = i / 16 * 2 * Math.PI;
        coil.push(p.clone().addScaledVector(n, 0.55 * Math.cos(a)).addScaledVector(side, 0.55 * Math.sin(a)));
      }
      group.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(coil), coil.length, 0.09, 5), M.black));
      rod(P(cu, f.back, y0 + 11.75), P(cu, f.back, y0 + 13), 0.72, M.brass); // collar
      rod(P(cu, f.back, y0 + 12.25), P(cu, fv, y0 + 12.25), 0.3, M.brass); // dock arm
      rod(P(cu, fv, y0 + 14), P(cu, fv, y0 + 9.5), 0.65, M.black); // sprayhead
      rod(P(cu, fv, y0 + 14), P(cu, fv, y0 + 13.4), 0.7, M.brass);
      B(cu - 0.2, fv + 0.6, y0 + 11, 0.4, 0.15, 2, M.brass); // buttons, facing the aisle
      rod(P(cu + 0.6, f.back, y0 + 5), P(cu + 2.9, f.back, y0 + 5), 0.6, M.black); // lever hub
      rod(P(cu + 2.6, f.back, y0 + 5), P(cu + 2.6, f.back, y0 + 5 + 3.3125), 0.2, M.brass); // lever, at rest
    }
    base = false;
    for (const x of c.upper || []) {
      if (x.hood) { // curved glass canopy over a steel body (filter, 4 lights, touch panel in front), chimney to the ceiling
        const top = x.at + x.h, bw = 21, bd = 17, bu = u + (w - bw) / 2, bv = COUNTER / 2 - bd / 2; // body size assumed
        B(bu, bv, x.at, bw, bd, x.h, M.steel);
        B(bu + 3, bv + 3, x.at - 0.05, bw - 6, bd - 6, 0.05, M.drain); // mesh filter
        for (const [lu, lv] of [[1.5, 1.5], [bw - 1.5, 1.5], [1.5, bd - 1.5], [bw - 1.5, bd - 1.5]]) rod(P(bu + lu, bv + lv, x.at - 0.1), P(bu + lu, bv + lv, x.at), 0.75, M.light);
        B(bu + bw / 2 - 3, bv + bd, x.at + 0.5, 6, 0.05, 1, M.black); // touch panel
        const glass = new THREE.PlaneGeometry(x.w, HOOD, 32, 1), pos = glass.attributes.position;
        for (let i = 0; i < pos.count; i++) pos.setZ(i, -x.h * (2 * pos.getX(i) / x.w) ** 2); // ends droop to the canopy bottom
        const pane = new THREE.Mesh(glass, M.hoodGlass);
        pane.add(new THREE.LineSegments(new THREE.EdgesGeometry(glass), edges));
        pane.rotation.x = -Math.PI / 2;
        pane.position.set(...P(u + w / 2, COUNTER / 2, top));
        group.add(pane);
        B(u + (w - x.chimney) / 2, COUNTER / 2 - x.chimneyD / 2, top, x.chimney, x.chimneyD, CEILING - top, M.steel);
      } else if (x.microwave) {
        const mu = u + (w - x.w) / 2;
        B(mu, 2, x.at, x.w, 15, x.h, M.steel);
        B(mu + 1.5, 17, x.at + 1.5, x.w - 8, 0.1, x.h - 5, M.black);
      } else if (x.coffee || x.appliance) B(u + (w - x.w) / 2, 2, x.at, x.w, APPLIANCE, x.h, M.black);
      else if (x.shelf) B(u, 0, x.at - 0.75, w, UPPER, 0.75, M.box);
      else if (x.filler) B(u, 0, x.at, w, UPPER, x.h, M.box);
      else if (x.light) B(u + (w - x.w) / 2, UPPER - 4, x.at, x.w, 3.5, x.h, M.light); // under-cabinet light bar near the front edge (3 1/2" wide, Nicor UCB sheet)
      else { // wall cabinet: depth from the code (W362424 is 24" deep), else 12"
        const d = +(x.code.match(/^W\d{4}(\d\d)/) || [])[1] || UPPER;
        B(u, 0, x.at, w, d, x.h, M.box);
        fronts(u, w, x.at + x.h, [{ h: x.h, pair: true, pull: 'bottom', glass: x.glass }], d);
      }
    }
  }
  // Countertop over each stretch of base-height items; 1" overhang only at the ends of the run.
  run.forEach((c, i) => {
    if (c.h || (i > 0 && !run[i - 1].h)) return;
    let j = i;
    while (j + 1 < run.length && !run[j + 1].h) j++;
    const l = c.u - (i === 0 ? 1 : 0), r = run[j].u + run[j].w + (j === run.length - 1 ? 1 : 0);
    for (let k = i; k <= j; k++) { // counter behind the cabinet backs: c.back, else the run's back; neighbors with the same depth share a piece
      const d = run[k].back ?? back;
      if (!d || (k > i && (run[k - 1].back ?? back) === d)) continue;
      let m = k;
      while (m < j && (run[m + 1].back ?? back) === d) m++;
      const bl = k === i ? l : run[k].u, br = m === j ? r : run[m].u + run[m].w;
      B(bl, -d, BOX, br - bl, d, TOP, M.counter);
    }
    const h = run.slice(i, j + 1).find(c => c.sink); // counter in four pieces around the sink cutout
    if (!h) return B(l, 0, BOX, r - l, COUNTER, TOP, M.counter);
    const s = h.sink, a = h.u + (h.w - s.w) / 2, b = a + s.w;
    B(l, 0, BOX, a - l, COUNTER, TOP, M.counter);
    B(b, 0, BOX, r - b, COUNTER, TOP, M.counter);
    B(a, 0, BOX, s.w, s.v, TOP, M.counter);
    B(a, s.v + s.d, BOX, s.w, COUNTER - s.v - s.d, TOP, M.counter);
  });
  return B;
}

const runs = { island: new THREE.Group(), wall: new THREE.Group() };
scene.add(runs.island, runs.wall);
group = runs.island;
side(island, false, 0, 1.75); // counter 1 3/4" past the cabinet backs (the 3/4" plywood, then 1"), 6 3/4" behind items with back: 6.75
cube(0, 0, -0.75, island.reduce((s, c) => s + c.w, 0), BOX, 0.75, [M.naval, M.naval, M.ply, M.ply, M.ply, M.front]); // 3/4" plywood on the island's back, floor to the counter's underside: Naval ends, Bright White back (box faces +x, -x, +y, -y, +z, -z)
group = runs.wall;
side(wall, true, ZWALL, 0, false); // base cabinets Bright White (2026-10-27)
group = scene;

// Room: floor, and the wall behind the wall run, only as wide as the run (one-sided, so it hides itself when viewed from behind).
const floor = new THREE.Mesh(new THREE.PlaneGeometry(total + 96, ZWALL + 48), M.floor);
floor.rotation.x = -Math.PI / 2;
floor.position.set(total / 2, 0, ZWALL / 2 - 24);
scene.add(floor);
const back = new THREE.Mesh(new THREE.PlaneGeometry(total, CEILING), M.wall);
back.rotation.y = Math.PI;
back.position.set(total / 2, CEILING / 2, ZWALL);
scene.add(back);

scene.add(new THREE.HemisphereLight('#ffffff', '#b0a080', 2.2));
for (const [x, y, z] of [[-100, 300, 200], [300, 250, -100]]) { // one light toward each run's fronts
  const sun = new THREE.DirectionalLight('#ffffff', 1);
  sun.position.set(x, y, z);
  scene.add(sun);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
const mid = ZWALL / 2;
const views = { // camera position, target, run to hide (it would block the view)
  end: [[total + 150, 160, mid], [total / 2, 36, mid]],
  island: [[total / 2, 80, ZWALL + 150], [total / 2, 40, 20], 'wall'],
  wall: [[total / 2, 60, -150], [total / 2, 48, ZWALL - 12], 'island'],
  top: [[total / 2, 420, mid + 0.01], [total / 2, 0, mid]],
};
const show = (name) => {
  const [pos, target, hide] = views[name];
  camera.position.set(...pos);
  controls.target.set(...target);
  controls.update();
  for (const r in runs) runs[r].visible = r !== hide;
  back.visible = hide !== 'wall';
};
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => show(b.dataset.view));
show('end');

const resize = () => {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight - document.querySelector('header').offsetHeight;
  renderer.setSize(w, h, false); // CSS sets the width, so a phone's layout viewport can't grow with the canvas
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
};
addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
